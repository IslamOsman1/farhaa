<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دعوة زفاف</title>
    <!-- خطوط جوجل: Aref Ruqaa للخطوط الكلاسيكية و Tajawal للخطوط العادية -->
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- موسيقى الخلفية -->
    <audio id="bgMusic" loop preload="auto"></audio>

    <!-- واجهة المظروف -->
    <div id="envelope-screen" class="envelope-screen">
        <div class="envelope-wrapper" id="envelope">
            <div class="envelope-back"></div>
            <div class="envelope-flap" id="flap"></div>
            <div class="envelope-front"></div>
            
            <div class="seal" id="sealBtn">
                <span>افتح الدعوة</span>
            </div>
            
            <!-- نص ترحيبي فوق المظروف -->
            <div class="envelope-text">
                <p id="env-guest-name">ضيفنا العزيز</p>
                <p class="tap-hint">انقر لفتح الدعوة</p>
            </div>
        </div>
    </div>

    <!-- محتوى الدعوة (تظهر بعد فتح المظروف) -->
    <div id="invitation-container" class="invitation-container hidden">
        <div class="inv-card">
            
            <!-- الزخرفة العلوية -->
            <div class="ornament top-ornament"></div>

            <section class="hero-section">
                <h1 class="welcome-text" id="heroInvite">نتشرف بدعوتكم لحضور حفل زفافنا</h1>
                <div class="couple-names">
                    <span id="groomName">العريس</span>
                    <span class="and-text">و</span>
                    <span id="brideName">العروس</span>
                </div>
                <div class="date-highlight" id="heroDate"></div>
            </section>

            <section class="verse-section">
                <p id="verseText" class="verse"></p>
                <p id="invitationText" class="inv-text"></p>
            </section>

            <section class="families-section">
                <div class="family">
                    <h3 id="groomParentsLabel" class="family__label">عائلة العريس</h3>
                    <p id="groomParents"></p>
                </div>
                <div class="family">
                    <h3 id="brideParentsLabel" class="family__label">عائلة العروس</h3>
                    <p id="brideParents"></p>
                </div>
            </section>

            <section class="details-section">
                <div class="detail-box">
                    <div class="icon">📅</div>
                    <div class="info">
                        <p id="weddingDate"></p>
                        <p id="weddingTime" class="time-text"></p>
                    </div>
                </div>
                <div class="detail-box">
                    <div class="icon">📍</div>
                    <div class="info">
                        <p id="venueName" class="venue-name"></p>
                        <p id="venueAddr" class="venue-addr"></p>
                        <a href="#" id="mapBtn" target="_blank" class="map-link">رابط الموقع</a>
                    </div>
                </div>
            </section>

            <!-- قسم المعرض -->
            <section class="gallery-section" id="gallery-section">
                <h2 class="section-title">صورنا</h2>
                <div class="gallery-grid" id="galleryGrid"></div>
            </section>

            <!-- قسم البرنامج -->
            <section class="program-section" id="program-section">
                <h2 class="section-title">برنامج الحفل</h2>
                <div class="timeline" id="timeline"></div>
            </section>

            <!-- الملاحظات -->
            <section class="notes-section" id="notes-section">
                <div class="notes-list" id="notesList"></div>
            </section>

            <!-- تأكيد الحضور (RSVP) -->
            <section class="rsvp-section" id="rsvp-section">
                <h2 class="section-title">تأكيد الحضور</h2>
                <p class="rsvp-sub">يسعدنا تأكيد حضوركم</p>
                <form id="rsvp-form" class="rsvp-form">
                    <div class="form-group">
                        <label>الاسم الكريم</label>
                        <input type="text" name="guestName" required placeholder="الاسم" />
                    </div>
                    <div class="form-group">
                        <label>هل ستحضر؟</label>
                        <div class="pills">
                            <button type="button" class="pill active" data-val="confirmed">نعم</button>
                            <button type="button" class="pill" data-val="declined">لا</button>
                            <button type="button" class="pill" data-val="maybe">ربما</button>
                        </div>
                        <input type="hidden" name="status" id="statusInput" value="confirmed">
                    </div>
                    <div class="form-group">
                        <label>عدد المرافقين (إن وُجد)</label>
                        <div class="counter">
                            <button type="button" id="comp-minus">-</button>
                            <span id="comp-count">0</span>
                            <button type="button" id="comp-plus">+</button>
                        </div>
                        <input type="hidden" name="companions" id="compInput" value="0">
                    </div>
                    <div class="form-group">
                        <label>كلمة للعرسان</label>
                        <textarea name="message" rows="3" placeholder="ألف مبروك..."></textarea>
                    </div>
                    <button type="submit" class="submit-btn" id="submitBtn">إرسال التأكيد</button>
                    <div id="rsvpMsg" class="form-msg"></div>
                </form>
            </section>

            <section class="footer-section">
                <p id="closingNote" class="closing-note"></p>
                <p id="closingHashtag" class="closing-hashtag"></p>
                <p id="closingFamilies" class="closing-families"></p>
            </section>
            
            <!-- الزخرفة السفلية -->
            <div class="ornament bottom-ornament"></div>
        </div>
    </div>

    <!-- أزرار التحكم بالصوت -->
    <button id="musicToggle" class="music-btn hidden">🎵</button>

    <script src="./script.js"></script>
<script src="/generic_script.js?v=1786470920669"></script>
</body>
</html>
